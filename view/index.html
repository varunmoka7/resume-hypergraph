<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile</title>
<meta name="description" content="">
<meta name="theme-color" content="#0E1110">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add('js')</script>
<script src="graph.js" defer></script>
</head>
<body>
<a class="skip-link" href="#work">Skip to work</a>
<header class="landing" id="top">
  <button type="button" class="portrait" id="portrait" aria-expanded="true" aria-controls="reveal"></button>
  <h1 data-k="name"></h1>
  <p class="role-line" data-k="roleLine"></p>
  <p class="cue">Open the graph</p>
  <div class="reveal" id="reveal">
    <p class="next" data-k="next"></p>
    <p class="meta langs"></p>
    <div class="actions">
      <a class="cv" data-cv hidden>CV</a>
      <nav class="links" aria-label="Contact links"></nav>
    </div>
  </div>
</header>
<section class="scene" id="work" aria-label="Experience and skills">
  <div class="stage" tabindex="-1">
    <canvas class="ground" aria-hidden="true"></canvas>
    <div class="topline">
      <p class="topline-name" data-k="name"></p>
      <a class="cv" data-cv hidden>CV</a>
      <nav class="links" aria-label="Contact links"></nav>
    </div>
    <p class="sr-only" id="graph-alt"></p>
  </div>
</section>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
  <button type="button" class="panel-close">Close</button>
  <div class="panel-body"></div>
</aside>
<footer class="contact">
  <h2>Contact</h2>
  <nav class="links" aria-label="Contact links"></nav>
</footer>
<p class="made"><a href="https://github.com/varunmoka7/resume-hypergraph" target="_blank" rel="noopener">Made with resume-hypergraph</a></p>
</body>
</html>
